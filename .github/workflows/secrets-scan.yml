# secrets-scan.yml
# Scans every commit for leaked secrets: Firebase API keys (AIzaSy...),
# service-account private keys, enotify tokens, Razorpay keys, JWTs, and
# generic high-entropy credentials. Advisory on first offense, blocking on
# re-introduction of known shapes.
name: Secrets Scan

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
          GITLEAKS_ENABLE_SUMMARY: true
        continue-on-error: true
